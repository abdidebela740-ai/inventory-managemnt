<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Management — EPSS Stock-Multiple</title>
<link rel="icon" href="epss-logo.png" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ── Page-specific layout. Reuses style.css tokens (--bg, --surface,
     --border, --text, --muted, --blue, --green, --amber, --red,
     --radius-*) so it inherits every theme (dark/light/hc/horizon/
     quartz-dark) automatically — no separate palette to maintain. ── */

  body { min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--app-font-family); transition: var(--theme-transition); }

  .um-shell { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }

  .um-header { display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .um-header .back-link { display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); text-decoration: none; font-size: 0.85rem; margin-bottom: 6px; }
  .um-header .back-link:hover { color: var(--blue); }
  .um-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
  .um-subtitle { color: var(--muted); font-size: 0.88rem; margin-top: 2px; }

  .um-role-note { font-size: 0.8rem; color: var(--muted); background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 14px; }

  .btn { border: 1px solid var(--border2); background: var(--surface2); color: var(--text);
    padding: 9px 16px; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 600;
    cursor: pointer; transition: var(--theme-transition); display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); color: #fff; }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { border-color: var(--red); color: var(--red); }
  .btn-sm { padding: 5px 11px; font-size: 0.76rem; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn[disabled]:hover { border-color: var(--border2); color: var(--text); }

  .um-toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .um-search { flex: 1; min-width: 220px; position: relative; }
  .um-search input { width: 100%; padding: 9px 12px 9px 34px; border-radius: var(--radius-md);
    border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-size: 0.86rem; }
  .um-search::before { content: "🔍"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    font-size: 0.8rem; opacity: 0.6; }
  select.um-filter { padding: 9px 12px; border-radius: var(--radius-md); border: 1px solid var(--border2);
    background: var(--surface); color: var(--text); font-size: 0.84rem; }

  .um-table-wrap { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden;
    background: var(--surface); }
  table.um-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .um-table thead th { text-align: left; padding: 11px 14px; background: var(--surface2);
    color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border); }
  .um-table tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .um-table tbody tr:last-child td { border-bottom: none; }
  .um-table tbody tr:hover { background: var(--surface2); }
  .um-name { font-weight: 700; }
  .um-email { color: var(--muted); font-size: 0.78rem; }

  .role-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem;
    font-weight: 700; border: 1px solid var(--border2); }
  .role-admin { color: var(--purple); border-color: var(--purple); }
  .role-director, .role-deputy_director { color: var(--blue); border-color: var(--blue); }
  .role-team_leader { color: var(--amber); border-color: var(--amber); }
  .role-branch_demand_officer { color: var(--green); border-color: var(--green); }
  .role-user { color: var(--muted); }

  .scope-chip { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 0.68rem;
    font-weight: 700; background: var(--blue-soft); color: var(--blue); margin: 1px 3px 1px 0; }
  .scope-more { color: var(--muted); font-size: 0.7rem; cursor: help; }

  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .status-active .status-dot { background: var(--green); }
  .status-inactive .status-dot { background: var(--dim); }
  .status-inactive { color: var(--muted); }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }

  .um-empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .um-empty-icon { font-size: 2rem; margin-bottom: 10px; opacity: 0.5; }
  .um-skeleton-row td { padding: 14px; }
  .um-skeleton-bar { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 37%, var(--surface2) 63%);
    background-size: 400% 100%; animation: um-shimmer 1.4s ease infinite; }
  @keyframes um-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  /* ── Modal ── */
  .um-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200;
    display: none; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; }
  .um-modal-backdrop.open { display: flex; }
  .um-modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    width: 100%; max-width: 560px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .um-modal-header { display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .um-modal-header h2 { font-size: 1.05rem; font-weight: 800; }
  .um-modal-close { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
  .um-modal-body { padding: 20px 22px; max-height: 62vh; overflow-y: auto; }
  .um-modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 22px;
    border-top: 1px solid var(--border); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .field input[type="text"], .field input[type="email"], .field input[type="password"], .field select {
    width: 100%; padding: 9px 12px; border-radius: var(--radius-md); border: 1px solid var(--border2);
    background: var(--surface); color: var(--text); font-size: 0.88rem; }
  .field-hint { font-size: 0.74rem; color: var(--dim); margin-top: 5px; }
  .field-locked { opacity: 0.55; }
  .field-locked input, .field-locked select { cursor: not-allowed; }

  .scope-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .scope-check, .perm-check { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.82rem; cursor: pointer; }
  .scope-check:hover, .perm-check:hover { border-color: var(--blue); }
  .scope-check input, .perm-check input { accent-color: var(--blue); }
  .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .perm-group-label { grid-column: 1 / -1; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--dim); margin: 10px 0 2px; }

  .um-alert { padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.82rem; margin-bottom: 14px; }
  .um-alert-error { background: rgba(224,69,69,0.12); color: var(--red); border: 1px solid rgba(224,69,69,0.3); }
  .um-alert-success { background: rgba(48,168,95,0.12); color: var(--green); border: 1px solid rgba(48,168,95,0.3); }

  .um-denied { text-align: center; padding: 90px 20px; }
  .um-denied .icon { font-size: 2.5rem; margin-bottom: 12px; }

  @media (max-width: 640px) {
    .scope-grid, .perm-grid { grid-template-columns: 1fr; }
    .um-table thead { display: none; }
    .um-table, .um-table tbody, .um-table tr, .um-table td { display: block; width: 100%; }
    .um-table tr { border-bottom: 1px solid var(--border); padding: 10px 0; }
    .um-table td { border: none; padding: 4px 14px; }
  }
</style>
</head>
<body data-theme="">
<div class="um-shell">

  <div class="um-header">
    <div>
      <a class="back-link" href="index.html">← Back to Dashboard</a>
      <div class="um-title">👥 User Management</div>
      <div class="um-subtitle" id="um-subtitle">Loading…</div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <div class="um-role-note" id="um-role-note" style="display:none;"></div>
      <button class="btn btn-primary" id="um-create-btn" style="display:none;">＋ New User</button>
    </div>
  </div>

  <div id="um-alert-slot"></div>

  <!-- Access denied state (non-Admin/Director/Deputy) -->
  <div class="um-denied" id="um-denied" style="display:none;">
    <div class="icon">🔒</div>
    <div style="font-weight:700; margin-bottom:6px;">You don't have access to User Management</div>
    <div style="color:var(--muted); font-size:0.88rem;">This area is limited to Admin, Director, and Deputy Director accounts.</div>
    <a class="btn" href="index.html" style="margin-top:18px; display:inline-flex;">← Back to Dashboard</a>
  </div>

  <div id="um-main" style="display:none;">
    <div class="um-toolbar">
      <div class="um-search"><input type="text" id="um-search-input" placeholder="Search by name or email…" /></div>
      <select class="um-filter" id="um-role-filter">
        <option value="">All Roles</option>
        <option value="admin">Admin</option>
        <option value="director">Director</option>
        <option value="deputy_director">Deputy Director</option>
        <option value="team_leader">Team Leader</option>
        <option value="branch_demand_officer">Branch Demand Officer</option>
        <option value="user">User</option>
      </select>
      <select class="um-filter" id="um-status-filter">
        <option value="">All Statuses</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>

    <div class="um-table-wrap">
      <table class="um-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Data Scopes</th>
            <th>Status</th>
            <th style="text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="um-table-body">
          <tr class="um-skeleton-row"><td colspan="5"><div class="um-skeleton-bar"></div></td></tr>
          <tr class="um-skeleton-row"><td colspan="5"><div class="um-skeleton-bar"></div></td></tr>
          <tr class="um-skeleton-row"><td colspan="5"><div class="um-skeleton-bar"></div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="um-empty" id="um-empty" style="display:none;">
      <div class="um-empty-icon">🗂️</div>
      <div>No users match your filters.</div>
    </div>
  </div>

</div>

<!-- ═══ Create / Edit Modal ═══ -->
<div class="um-modal-backdrop" id="um-modal-backdrop">
  <div class="um-modal">
    <div class="um-modal-header">
      <h2 id="um-modal-title">New User</h2>
      <button class="um-modal-close" id="um-modal-close">✕</button>
    </div>
    <div class="um-modal-body" id="um-modal-body">
      <!-- populated by user-management.js -->
    </div>
    <div class="um-modal-footer">
      <button class="btn" id="um-modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="um-modal-save">Save</button>
    </div>
  </div>
</div>

<script src="auth.js" defer></script>
<script src="filters.js" defer></script>
<script src="permissions.js" defer></script>
<script src="user-management.js" defer></script>
</body>
</html>
